plugins {
    id 'com.android.library'
    id "com.vanniktech.maven.publish" version "0.33.0"
    id 'signing'
}

android {
    namespace 'cn.thinkingdata.analytics'
    compileSdk 35

    defaultConfig {
        minSdk 14
        versionCode 1
        versionName "1.0.0-test"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFile 'proguard-rules.pro'
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = [TROUTER_MODULE_NAME: 'Analytic']
            }
        }
    }
    buildFeatures {
        buildConfig = true // 显式启用 BuildConfig 生成（默认启用）
    }
    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            minifyEnabled true
            zipAlignEnabled true
            buildConfigField("String", "VERSION_NAME", "\"${VERSION_NAME_ANALYTICS}\"")
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            zipAlignEnabled true
            buildConfigField("String", "VERSION_NAME", "\"${VERSION_NAME_ANALYTICS}\"")
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions {
        unitTests { returnDefaultValues = true }
    }
}

dependencies {
    api "${POM_GROUP_ID}:TDCore:${VERSION_NAME_CORE}"
    compileOnly project(path: ':ta_apt')
    annotationProcessor project(path: ':ta_apt')
    testImplementation libs.junit
    testImplementation 'org.json:json:20231013'
    testImplementation 'org.mockito:mockito-core:4.11.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}

mavenPublishing {

    coordinates(POM_GROUP_ID, "ThinkingAnalyticsSDK", VERSION_NAME_ANALYTICS)

    pom {
        name = "ThinkingAnalyticsSDK"
        description = "ThinkingAnalytics Android SDK"
        url = "https://github.com/ThinkingDataAnalytics/android-sdk"
        licenses {
            license {
                name = "The Apache License, Version 2.0"
                url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
                distribution = "http://www.apache.org/licenses/LICENSE-2.0.txt"
            }
        }
        developers {
            developer {
                id = "ThinkingData"
                name = "ThinkingData"
                url = "https://www.thinkingdata.cn//"
            }
        }
        scm {
            url = "https://github.com/ThinkingDataAnalytics/android-sdk/tree/master"
            connection = "scm:git:github.com/ThinkingDataAnalytics/android-sdk.git"
            developerConnection = "scm:git:ssh://github.com/ThinkingDataAnalytics/android-sdk.git"
        }
    }
}